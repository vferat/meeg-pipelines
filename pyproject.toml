[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools >= 64.0.0', 'setuptools-scm>=8']

[project]
authors = [
  {email = 'victor.ferat@fcbg.ch', name = 'Victor Férat'},
]
classifiers = [
  'License :: OSI Approved :: MIT License',
  'Natural Language :: English',
  'Operating System :: MacOS',
  'Operating System :: Microsoft :: Windows',
  'Operating System :: Unix',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.9',
]
dependencies = [
  'numpy>=1.21',
  'packaging',
  'psutil',
  'pybids',
  'mne[full]==1.12.1',
  'mne-bids',
  'h5io',
  'smriprep==0.20.0',
]
description = 'MEG and EEG pipelines.'
dynamic = ['version']
keywords = [
  'python',
  'meg',
  'eeg',
  'mri',
]
license = {file = 'LICENSE'}
maintainers = [
  {email = 'victor.ferat@fcbg.ch', name = 'Victor Férat'},
]
name = 'meegpype'
readme = 'README.md'
requires-python = '>=3.9'

[project.optional-dependencies]
all = [
  'meegpype[build]',
  'meegpype[doc]',
  'meegpype[stubs]',
  'meegpype[style]',
  'meegpype[test]',
]
build = [
  'build',
  'twine',
]
doc = [
  'intersphinx_registry',
  'memory-profiler',
  'numpydoc',
  'pydata-sphinx-theme',
  'sphinx',
  'sphinx-copybutton',
  'sphinx-design',
  'sphinx-gallery',
  'sphinx-issues',
  'sphinxcontrib-bibtex',
  'sphinx-argparse',
  'sphinxcontrib-apidoc',
  'myst_parser',
]
full = [
  'meegpype[all]',
]
stubs = [
  'isort',
  'mypy',
  'ruff>=0.1.8',
]
style = [
  'bibclean',
  'codespell[toml]>=2.2.4',
  'isort',
  'pydocstyle[toml]',
  'ruff>=0.1.8',
  'toml-sort',
  'yamllint',
]
test = [
  'pytest-cov',
  'pytest-timeout',
  'pytest>=8.0',
]

[project.scripts]
meegpype-sys_info = 'meegpype.commands.sys_info:run'
meegpype-forward = 'meegpype.commands.forward:run'
meegpype-fslr =  'meegpype.commands.fslr:run'
meegpype-fslabelling = 'meegpype.commands.fslabelling:run'

[project.urls]
documentation = 'https://github.com/vferat/meeg-pipelines'
homepage = 'https://github.com/vferat/meeg-pipelinesn'
source = 'https://github.com/vferat/meeg-pipelines'
tracker = 'https://github.com/vferat/meeg-pipelines/issues'

[tool.codespell]
check-filenames = true
check-hidden = true
ignore-words = '.codespellignore'
skip = 'build,.git,.mypy_cache,.pytest_cache,.venv'

[tool.coverage.report]
exclude_lines = [
  'if __name__ == .__main__.:',
  'if TYPE_CHECKING:',
  'pragma: no cover',
]
precision = 2

[tool.coverage.run]
branch = true
cover_pylib = false
omit = [
  '**/__init__.py',
  '**/conftest.py',
  '**/meegpype/_version.py',
  '**/meegpype/commands/*',
  '**/meegpype/utils/_fixes.py',
  '**/tests/**',
]

[tool.isort]
extend_skip_glob = [
  'doc/*',
  'examples/*',
  'tutorials/*',
]
line_length = 88
multi_line_output = 3
profile = 'black'
py_version = 39

[tool.pixi.activation.env]
FSLDIR = '$CONDA_PREFIX'
# Use the conda-forge Qt (PySide6) rather than the PyQt6 wheel pulled by mne[full],
# so that Qt, VTK and their X11/OpenGL libraries all come from the pixi environment
QT_API = 'pyside6'

[tool.pixi.dependencies]
# Keep in sync with sMRIPrep's [tool.pixi.dependencies]
ants = '2.6.*'
connectome-workbench-cli = {build = '*qt6*', version = '2.0.*'}
fsl-bet2 = '2111.8.*'
fsl-fast4 = '2111.3.*'
fsl-flirt = '2111.4.*'
fsl-miscmaths = '2412.4.*'
graphviz = '12.2.*'
h5py = '3.13.*'
matplotlib = '3.10.*'
mkl = '2024.2.2.*'
mkl-service = '2.4.2.*'
nodejs = '20.*'
numpy = '2.2.*'
pandas = '2.2.*'
pandoc = '3.7.*'
python = '3.12.*'
scikit-image = '0.25.*'
scikit-learn = '1.6.*'
scipy = '1.15.*'
# meegpype: 3D rendering stack (VTK/Qt/Mesa) from conda-forge for headless MNE under Xvfb
ffmpeg = '*'
libegl = '*'
libgl = '*'
mesalib = '*'
pyside6 = '6.*'
pyvista = '*'
pyvistaqt = '*'
vtk = '9.*'

[tool.pixi.environments]
default = {features = ['editable'], solve-group = 'default'}
# Environment shipped in the Docker image
meegpype = {features = ['editable'], solve-group = 'default'}
test = {features = ['editable', 'test'], solve-group = 'default'}

[tool.pixi.feature.editable.pypi-dependencies]
meegpype = {editable = true, path = '.'}

[tool.pixi.pypi-options.dependency-overrides]
numpy = '>=2.2'

[tool.pixi.workspace]
channels = [
  'https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public',
  'conda-forge',
]
platforms = ['linux-64']

[tool.pydocstyle]
add_ignore = 'D100,D104,D107'
convention = 'numpy'
ignore-decorators = '(copy_doc|property|.*setter|.*getter|pyqtSlot|Slot)'
match = '^(?!__init__|test_).*\.py'
match-dir = '^meegpype.*'

[tool.pytest.ini_options]
addopts = '--durations 20 --junit-xml=junit-results.xml --verbose'
minversion = '8.0'

[tool.ruff]
extend-exclude = [
  'doc',
]
line-length = 88
target-version = 'py39'

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = []
select = ['A', 'B', 'E', 'F', 'G', 'LOG', 'NPY', 'PIE', 'PT', 'T20', 'UP', 'W']

[tool.ruff.lint.per-file-ignores]
'*' = [
  'B904', # 'Within an except clause, raise exceptions with raise ... from ...'
  'UP007', # 'Use `X | Y` for type annotations', requires python 3.10
]
'*.pyi' = ['E501']
'__init__.py' = ['F401']

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ['meegpype*tests']
include = ['meegpype*']

[tool.setuptools_scm]
version_file = 'meegpype/_version.py'
version_scheme = 'release-branch-semver'

[tool.tomlsort]
all = true
ignore_case = true
trailing_comma_inline_array = true
